name: Type Check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  workflow_call:

concurrency:
  # One group per PR, so a new push cancels the runs it replaces.
  # Pushes to master keep one group per commit and are never cancelled.
  group: typecheck-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group test

      - name: Run type checking
        run: uv run --with ty ty check .

      - name: Check type examples with ty
        run: uv run --with ty ty check tests/typecheck

      - name: Check type examples with pyrefly
        run: uvx pyrefly@1.3.1 check tests/typecheck
