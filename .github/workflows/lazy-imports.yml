name: Lazy imports

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  # One group per PR, so a new push cancels the runs it replaces.
  # Pushes to master keep one group per commit and are never cancelled.
  group: lazy-imports-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lazy-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    # lazy-fix runs on 3.12 and newer, so the project environment can run it.
    - name: Check lazy imports
      run: uv run --group dev lazy-fix check .
