name: Lazy imports

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lazy-fix:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    # lazy-fix runs on 3.12 and newer, so the project environment can run it.
    - name: Check lazy imports
      run: uv run --group dev lazy-fix check .
