name: Lazy imports

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lazy-fix:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    # lazy-fix itself needs Python 3.15, while the project supports older versions.
    - name: Check lazy imports
      run: uvx --python 3.15 lazy-fix check .
