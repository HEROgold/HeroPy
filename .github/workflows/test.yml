name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  workflow_call:

concurrency: test-${{ github.sha }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: heropy
          POSTGRES_PASSWORD: heropy
          POSTGRES_DB: heropy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U heropy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # uv-managed Python ships tkinter; the runner's system Python does not.
      UV_PYTHON_PREFERENCE: only-managed
      UV_PYTHON: ${{ matrix.python-version }}
      # The scope tests run against this Postgres too, and skip it when unset.
      HEROPY_TEST_POSTGRES_URL: postgresql+psycopg://heropy:heropy@localhost:5432/heropy_test

    steps:
    - uses: actions/checkout@v4

    - name: Cache pytest results
      id: cache-pytest
      uses: actions/cache@v4
      with:
        path: .pytest_cache
        key: ${{ runner.os }}-py${{ matrix.python-version }}-pytest-${{ hashFiles('**/tests/**/*.py', 'src/**') }}

    - name: Install uv
      if: steps.cache-pytest.outputs.cache-hit != 'true'
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Install dependencies
      if: steps.cache-pytest.outputs.cache-hit != 'true'
      run: uv sync --group test

    - name: Run tests
      if: steps.cache-pytest.outputs.cache-hit != 'true'
      run: uv run pytest .
