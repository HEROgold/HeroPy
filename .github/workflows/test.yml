name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  workflow_call:

concurrency: test-${{ github.sha }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
    env:
      # uv-managed Python ships tkinter; the runner's system Python does not.
      UV_PYTHON_PREFERENCE: only-managed
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
    - uses: actions/checkout@v4

    - name: Cache pytest results
      id: cache-pytest
      uses: actions/cache@v4
      with:
        path: .pytest_cache
        key: ${{ runner.os }}-py${{ matrix.python-version }}-pytest-${{ hashFiles('**/tests/**/*.py', 'src/**') }}

    - name: Install uv
      if: steps.cache-pytest.outputs.cache-hit != 'true'
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Install dependencies
      if: steps.cache-pytest.outputs.cache-hit != 'true'
      run: uv sync --group test

    - name: Run tests
      if: steps.cache-pytest.outputs.cache-hit != 'true'
      run: uv run pytest .
