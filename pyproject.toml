[project]
name = "herogold"
version = "6.1.0"
description = "A single package containing personal utilities."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
]
authors = [{ name = "HEROgold" }]
license = { text = "MIT" }

[project.optional-dependencies]
updater = [
    "httpxyz[http2]>=0.42.1"
]
config = [
    "confkit>=2.1.0",
]
currency = [
    "dinero>=0.4.0",
]
orm = [
    "herogold[config,currency]",
    "sqlmodel>=0.0.42",
]
api = [
    "fastapi>=0.141.1",
]
services = [
    "watchdog>=6.0.0",
]
all = [
    "herogold[orm,api,services,updater]",
]

[project.urls]
Homepage = "https://github.com/HEROgold/HeroPy"
Repository = "https://github.com/HEROgold/HeroPy.git"
Documentation = "https://github.com/HEROgold/HeroPy#readme"
Issues = "https://github.com/HEROgold/HeroPy/issues"

[build-system]
requires = ["hatchling>=1"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "funcsort>=2.0.2",
    "lazy-fix",
    "pyrefly==1.3.1",
    "ruff==0.16.5",
    "ty==0.0.77",
]
test = [
    "herogold[all]",
    "hypothesis>=6.168.0",
    "psycopg[binary]>=3.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.uv.sources]
lazy-fix = { git = "https://github.com/HEROgold/lazy-fix", rev = "111e8fec87e1df9e58404c469685a8173e387bd2" }

[tool.ty.src]
exclude = ["tests"]

[tool.lazy-fix]
# Only modules that no class or decorator uses while a module body runs.
# sqlmodel, sqlalchemy, confkit, pydantic and httpxyz stay eager, because
# subclassing or catching them resolves a lazy import immediately (ruff TID255).
allow = ["fastapi", "watchdog", "dinero"]
