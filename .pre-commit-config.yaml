default_language_version:
  python: python3.15

repos:
  # Generic hygiene checks — cheap, language-agnostic safety nets.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-toml
      - id: check-yaml
      - id: check-ast
      - id: check-docstring-first
      - id: debug-statements
      - id: name-tests-test
        args: [--pytest-test-first]
        files: ^tests/

  # Keep uv.lock honest whenever pyproject.toml changes.
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.6
    hooks:
      - id: uv-lock

  # Hooks published by each tool, pinned to the versions the project develops against.
  - repo: https://github.com/HEROgold/funcsort
    rev: v2.0.2
    hooks:
      - id: funcsort

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        args: [--fix, --unsafe-fixes]
      - id: ruff-format

  # Type checkers need the project's installed dependencies, so they run
  # through `uv run` instead of an isolated hook environment.
  - repo: local
    hooks:
      - id: ty-check
        name: ty check
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false

      - id: pyrefly-check
        name: pyrefly check (fallback, run manually with `prek run pyrefly-check`)
        entry: uv run pyrefly check
        language: system
        types: [python]
        pass_filenames: false
        stages: [manual]

# pre-commit.ci has no network for the git dependency (uv-lock) and no project
# environment (type checkers). GitHub Actions runs ty already.
ci:
  skip: [uv-lock, ty-check, pyrefly-check]
